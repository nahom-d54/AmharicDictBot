version: "3.9"

services:
  app:
    build: .
    image: amharicdictbot:latest
    container_name: amharicdictbot
    env_file: .env
    environment:
      # Default Mongo string (overridable from .env). Use service name for host.
      - MONGODB_URI=mongodb://mongodb:27017/telegram-bot
      # Ensure production by default in container
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  mongodb:
    image: mongo:7
    container_name: amharicdictbot-mongodb
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
    driver: local
